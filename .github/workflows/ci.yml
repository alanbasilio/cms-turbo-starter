name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, and test
        run: npx turbo run lint typecheck test

      # Build the web app (kubb generate runs from the committed OpenAPI doc).
      # The Strapi build is env-heavy and adds little here, so it's left out;
      # the CMS is still covered by typecheck above.
      - name: Build web
        run: npx turbo run build --filter=web
